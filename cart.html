<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PLANTOVIA | Cart</title>
  <link rel="stylesheet" href="style.css?v=20260801-stockreq" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">
      <img class="brand-logo" src="assets/plantovia-logo.png" alt="Plantovia logo">
    </a>
    <nav class="top-menu" aria-label="Main navigation"></nav>
  </header>

  <main class="cart-page" data-reveal>
    <div class="section-heading">
      <p class="eyebrow">Cart</p>
      <h1>Your order</h1>
    </div>

    <div id="cart-items"></div>

    <div class="cart-summary">
      <p>Subtotal <span>$<span id="cart-subtotal">0.00</span></span></p>
      <p>HST <span>$<span id="cart-tax">0.00</span></span></p>
      <p>Local delivery <span>$<span id="cart-shipping">0.00</span></span></p>
      <h2>Total <span>$<span id="cart-page-total">0.00</span></span></h2>
      <div class="checkout-actions">
        <button id="clear-cart">Clear Cart</button>
        <a href="delivery.html" class="button primary">Continue to Delivery</a>
      </div>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js?v=20260801-stockreq"></script>
</body>
</html>
