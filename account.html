<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PLANTOVIA | Account</title>
  <link rel="stylesheet" href="style.css?v=20260731-safe" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">
      <img class="brand-logo" src="assets/plantovia-logo.png" alt="Plantovia logo">
    </a>
    <nav class="top-menu" aria-label="Main navigation">
      <a href="cart.html" class="cart-summary-link"><span class="cart-summary-title">Cart</span><span class="cart-summary-meta"><span id="cart-count">0 items</span></span><span class="cart-summary-total">$<span id="cart-total">0.00</span></span></a>
    </nav>
  </header>

  <main class="account-page" data-reveal>
    <section class="account-box account-status-box" id="account-status-box" hidden>
      <p class="eyebrow">Your account</p>
      <h1>You're signed in</h1>
      <p class="account-status-line">Signed in as <strong id="account-status-email"></strong></p>
      <a href="purchase-history.html" class="button secondary">View Purchase History</a>
      <button id="customer-signout" class="button account-signout" type="button">Sign Out</button>
    </section>

    <section class="account-box" id="signup-box">
      <p class="eyebrow">New customer</p>
      <h1>Create account</h1>
      <input type="email" id="signup-username" autocomplete="email" placeholder="Email address">
      <input type="password" id="signup-password" minlength="8" autocomplete="new-password" placeholder="Password (8+ characters)">
      <button id="signup-btn" class="button primary">Sign Up</button>
    </section>

    <section class="account-box" id="signin-box">
      <p class="eyebrow">Returning customer</p>
      <h1>Sign in</h1>
      <input type="email" id="signin-username" autocomplete="email" placeholder="Email address">
      <input type="password" id="signin-password" autocomplete="current-password" placeholder="Password">
      <button id="signin-btn" class="button primary">Sign In</button>
      <button id="forgot-password-btn" class="link-button" type="button">Forgot your password?</button>
    </section>

    <section class="account-box" id="reset-password-box" hidden>
      <p class="eyebrow">Reset password</p>
      <h1>Choose a new password</h1>
      <p>Enter a new password for your Plantovia account.</p>
      <input type="password" id="reset-password-new" minlength="8" autocomplete="new-password" placeholder="New password (8+ characters)">
      <button id="reset-password-btn" class="button primary">Update Password</button>
    </section>

    <p id="account-message" class="form-message"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js?v=20260731-safe"></script>
</body>
</html>
