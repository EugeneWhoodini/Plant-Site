<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PLANTOVIA | Plant Details</title>
  <link rel="stylesheet" href="style.css?v=20260801-stockreq" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">
      <img class="brand-logo" src="assets/plantovia-logo.png" alt="Plantovia logo">
    </a>
    <nav class="top-menu" aria-label="Main navigation">
      <a href="cart.html" class="cart-summary-link"><span class="cart-summary-title">Cart</span><span class="cart-summary-meta"><span id="cart-count">0 items</span></span><span class="cart-summary-total">$<span id="cart-total">0.00</span></span></a>
    </nav>
  </header>

  <main class="plant-detail-page">
    <div class="plant-detail-container" data-reveal>
      <div class="plant-detail-image-box">
        <button id="detail-img-left" class="detail-img-arrow" aria-label="Previous image">&lsaquo;</button>
        <img id="detail-image" src="" alt="Plant image" />
        <button id="detail-img-right" class="detail-img-arrow" aria-label="Next image">&rsaquo;</button>
      </div>

      <div class="plant-detail-info">
        <a class="back-link" href="index.html">Back to catalogue</a>
        <p class="eyebrow">Aquarium plant</p>
        <h1 id="detail-name"></h1>
        <p id="detail-price"></p>
        <p id="detail-description"></p>

        <h2>Care Requirements</h2>
        <ul id="detail-requirements"></ul>

        <div class="quantity-control">
          <button id="detail-minus" aria-label="Decrease quantity">-</button>
          <span id="detail-quantity">1</span>
          <button id="detail-plus" aria-label="Increase quantity">+</button>
        </div>

        <button id="detail-add-cart" class="add-to-cart">Add to Cart</button>
        <div id="detail-request-stock"></div>
      </div>
    </div>
  </main>

  <script src="plants.js"></script>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js?v=20260801-stockreq"></script>
  <script src="plant.js?v=20260801-stockreq"></script>
</body>
</html>
