<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PLANTOVIA | Search</title>
  <link rel="stylesheet" href="style.css?v=20260802-featuredfix" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">
      <img class="brand-logo" src="assets/plantovia-logo.png" alt="Plantovia logo">
    </a>
    <nav class="top-menu" aria-label="Main navigation">
      <a href="cart.html" class="cart-summary-link"><span class="cart-summary-title">Cart</span><span class="cart-summary-meta"><span id="cart-count">0 items</span></span><span class="cart-summary-total">$<span id="cart-total">0.00</span></span></a>
    </nav>
  </header>

  <main class="form-page search-page" data-reveal>
    <div class="section-heading">
      <p class="eyebrow">Search</p>
      <h1>Find aquarium plants</h1>
    </div>
    <input type="search" id="search-input" placeholder="Search by plant name..." autocomplete="off" />

    <div class="search-page-filters">
      <div class="search-filter-categories" id="search-category-list"></div>
      <div class="search-filter-price">
        <label>Min price<input id="search-price-min" type="number" min="0" step="0.01" placeholder="No minimum"></label>
        <label>Max price<input id="search-price-max" type="number" min="0" step="0.01" placeholder="No maximum"></label>
      </div>
    </div>

    <div class="plant-grid compact" id="search-results"></div>
  </main>

  <script src="plants.js"></script>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js?v=20260802-featuredfix"></script>
</body>
</html>
